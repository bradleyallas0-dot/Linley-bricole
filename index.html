<style>
:root{--bg:#f6f2ec;--card:#fff;--tx:#2a2118;--mut:#7a6a5a;--bd:#e3d8ca;--ac:#9c6f40;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#251e18;--tx:#f3ebe1;--mut:#b5a595;--bd:#3d3328;--ac:#c08a52}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#251e18;--tx:#f3ebe1;--mut:#b5a595;--bd:#3d3328;--ac:#c08a52}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:1rem;color:var(--ac)}
.hd{display:flex;gap:14px;align-items:center}
.hd img{width:80px;height:auto}
.hd h1{margin:0;font-size:1.4rem;color:var(--ac)}
.co{font-size:.9rem;color:var(--mut);line-height:1.6;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
input,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
textarea{resize:vertical;min-height:100px}
.item{display:grid;grid-template-columns:1fr 70px 100px 28px;gap:6px;margin-bottom:8px;align-items:start}
.item .t{grid-column:1/-1;font-size:.85rem;color:var(--mut);text-align:right;margin-top:-2px}
@media(max-width:520px){.item{grid-template-columns:1fr 60px 90px 28px}}
.x{padding:6px 0;text-align:center;background:transparent;color:#d64545}
.btn{background:var(--ac);color:#fff;border:0;font-weight:700;padding:13px}
.btn.g{background:transparent;color:var(--ac);border:1px dashed var(--ac)}
.tot{text-align:right;font-size:.95rem;line-height:1.9;margin-top:12px}
.tot b{font-size:1.2rem;color:var(--ac)}
.pay{font-size:.95rem;line-height:1.8}
.clr{width:auto;padding:4px 12px;font-size:.78rem;background:transparent;color:var(--ac);border:1px solid var(--bd);margin-top:6px;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="card hd">
<img id="lg" alt="Linley Bricole logo">
<div><h1>LINLEY BRICOLE</h1>
<div class="co"><b>Address:</b> YY03 NHDC Bambous<br><b>Phone:</b> +230 57584428<br><b>Email:</b> linleyallas1@gmail.com<br><b>BRN:</b> 000443039787</div></div>
</div>

<div class="card">
<h2>Quotation details</h2>
<div class="grid">
<div class="full"><label>Quotation name (also used as the PDF file name)</label><input id="qname"></div>
<div><label>Quote number</label><input id="num"></div>
<div><label>Quotation date</label><input id="qd" type="date"></div>
<div class="full"><label>Subject</label><input id="subj" placeholder="e.g. Bathroom quotation"></div>
<div><label>Starting date</label><input id="sd" type="date"><button type="button" class="clr" onclick="document.getElementById('sd').value=''">Clear starting date</button></div>
<div><label>Ending date</label><input id="ed" type="date"><button type="button" class="clr" onclick="document.getElementById('ed').value=''">Clear ending date</button></div>
</div>
</div>

<div class="card">
<h2>Customer info</h2>
<div class="grid">
<div><label>Name</label><input id="cn"></div>
<div><label>Phone</label><input id="cp" inputmode="tel"></div>
<div><label>Address</label><input id="ca"></div>
<div><label>Email (optional)</label><input id="ce" type="email"></div>
</div>
</div>

<div class="card">
<h2>Items</h2>
<div id="items"></div>
<button class="btn g" id="addi">+ Add a line</button>
<div class="grid" style="margin-top:12px"><div><label>Down payment (Rs)</label><input id="dp" type="text" inputmode="decimal" autocomplete="off" placeholder="Type any amount, e.g. 5000"></div></div>
<div class="tot" id="tot"></div>
</div>

<div class="card">
<h2>Notes &amp; instructions</h2>
<textarea id="notes" placeholder="Write any notes or instructions for the client here…"></textarea>
</div>

<div class="card">
<h2>Payment methods</h2>
<div class="pay">Bank transfer: 000443039787<br>Juice: +230 57584428</div>
</div>

<button class="btn" id="pdf">📄 Save as PDF</button>
<p id="msg" style="text-align:center;color:var(--mut);font-size:.85rem"></p>
</main>

const Q=i=>(+i.q>0)?+i.q:1;
const iso=d=>d.toISOString().slice(0,10);
const money=n=>"Rs "+Number(n).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const fdate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
let items=[{d:"",q:1,p:0}],cnt=1;

const now=new Date(),end=new Date(Date.now()+14*864e5);
const mkNum=()=>"LB-"+new Date().getFullYear()+"-"+String(cnt).padStart(3,"0");
$("qd").value=iso(now);$("sd").value=iso(now);$("ed").value=iso(end);$("num").value=mkNum();
function totals(){
const total=items.reduce((s,i)=>s+Q(i)*(+i.p||0),0);
const dp=parseFloat(String($("dp").value).replace(/[^0-9.\-]/g,""))||0;
return{total,dp,bal:total-dp};
}
let mode="amt";
function paintTot(){
if(mode==="pct"){const tt=items.reduce((s,i)=>s+Q(i)*(+i.p||0),0),pc=parseFloat(String($("pct").value).replace(/[^0-9.]/g,""))||0;$("dp").value=pc?String(Math.round(tt*pc)/100):""}
const t=totals();
$("tot").innerHTML="<b>Grand total: "+money(t.total)+"</b><br>Down payment: "+money(t.dp)+"<br><b>Balance due: "+money(t.bal)+"</b>";
items.forEach((it,k)=>{const e=$("t"+k);if(e)e.textContent=money(Q(it)*(+it.p||0))});
}
function renderItems(){
$("items").innerHTML="";
items.forEach((it,k)=>{
const r=document.createElement("div");r.className="item";
r.innerHTML='<input placeholder="Description (e.g. Labour)"><input type="number" inputmode="decimal" min="0" placeholder="Qty"><input type="number" inputmode="decimal" min="0" placeholder="Unit price"><button class="x" title="Remove">✕</button><div class="t" id="t'+k+'"></div>';
const [d,q,p,x]=r.querySelectorAll("input,button");
d.value=it.d;q.value=it.q;p.value=it.p||"";
d.oninput=()=>{it.d=d.value};
q.oninput=()=>{it.q=q.value;paintTot()};
p.oninput=()=>{it.p=p.value;paintTot()};
x.onclick=()=>{if(items.length>1){items.splice(k,1);renderItems()}};
$("items").appendChild(r);
});
paintTot();
}
$("addi").onclick=()=>{items.push({d:"",q:1,p:0});renderItems()};
$("dp").oninput=paintTot;
renderItems();

async function savePdf(blob,fname){
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(mobile&&navigator.canShare){
const f=new File([blob],fname,{type:"application/pdf"});
if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:fname});return}catch(e){if(e&&e.name==="AbortError")throw e}}
}
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

["Address: YY03 NHDC Bambous","Phone: +230 57584428","Email address: linleyallas1@gmail.com","BRN: 000443039787"].forEach((l,i)=>doc.text(l,L+33,y+13+i*5));

[$("cn").value&&"Name: "+$("cn").value,$("ca").value&&"Address: "+$("ca").value,$("cp").value&&"Phone: "+$("cp").value,$("ce").value&&"Email: "+$("ce").value].filter(Boolean).forEach(l=>{doc.text(l,L,y);y+=5});

head();
items.forEach((it,k)=>{

if(y+h>270){doc.addPage();y=18;head()}

y+=h;doc.setDrawColor(220);doc.setLineWidth(0.2);doc.line(L,y,R,y);
});
y+=6;if(y>235){doc.addPage();y=18}
const t=totals(),row=(a,b,bold)=>{doc.setFont("helvetica","bold");doc.setFontSize(bold?12:10.5);doc.setTextColor(...(bold?BR:[40,40,40]));doc.text(a,150,y,{align:"right"});doc.text(b,R-2,y,{align:"right"});y+=bold?7:6;doc.setTextColor(40)};
row("GRAND TOTAL:",money(t.total),true);row("Down payment:",money(t.dp));row("Balance due:",money(t.bal),true);
y+=4;
const blk=(title,text)=>{const ls=doc.splitTextToSize(text,R-L);if(y+ls.length*5+10>280){doc.addPage();y=18}
doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...BR);doc.text(title,L,y);y+=5;doc.setFont("helvetica","normal");doc.setTextColor(40);doc.text(ls,L,y);y+=ls.length*5+4};
if($("notes").value.trim())blk("NOTES & INSTRUCTIONS",$("notes").value.trim());

const base=($("qname").value.trim()||"Quotation "+$("num").value).replace(/[\\\/:*?"<>|]+/g,"").trim();

$("num").value=mkNum();
}catch(e){msg.textContent=e&&e&&e.name==="AbortError"?"Saving cancelled.":"Could not save the PDF."}
};
